<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="blog.js" defer></script>
    <title>Svampletarna</title>
</head>

<body>
    <header>
        <h1>
            <a href="/">
                <img src="./img/svampletarna-logo.webp" alt="Svampletarna">
            </a>
        </h1>
        <nav>
            <ul>
                <li><a href="#" id="mainPage">Blogg</a></li>
                <li><a href="#" id="mushroomsPage">Svampar</a></li>
                <li><a href="#" id="foundPage">Hittade svampar</a></li>
                <li><a href="#" id="risksPage">Risker och egenskaper</a></li>
            </ul>
        </nav>
        <div>
            <span id="message"></span>
            <a href="#" id="logInBtn">Logga in</a>
        </div>
    </header>
    <div class="overlay hidden" id="overlay" hidden></div>
    <section class="logInWindow hidden" id="logInWindow" hidden>
        <span class="close-btn" id="closeBtn">&times;</span>
        <h2>Välkommen</h2>
        <form id="logInForm">
            <label for="name">Namn:</label>
            <input type="text" id="name" name="name" autocomplete="off" required>
            <label for="password">Lösenord:</label>
            <input type="password" id="password" name="password" autocomplete="off" required>
            <span id="formsMessage"></span>
            <button type="submit" id="btnSubmit">Logga in</button>
            <button type="button" id="createNewUserBtn">Skapa konto</button>
        </form>
    </section>
    <main>
        <div id="mainContainer"></div>
        <button id="createPostBtn" hidden>Skapa inlägg</button>
        <form id="postForm" hidden>
            <label for="postTitle">Titel:</label>
            <input type="text" id="postTitle" name="title" required>
            <label for="postText">Text:</label>
            <textarea id="postText" name="text" required></textarea>
            <button type="submit">Skapa inlägg</button>
        </form>
    </main>
    <footer>
        <p>&copy; Svampletarna 2026</p>
    </footer>
</body>

</html>
